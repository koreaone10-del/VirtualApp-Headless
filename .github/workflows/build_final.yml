name: Final Build AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source and prepare project
        run: |
          unzip -q virtualapp-source.zip -d source
          echo "=== Full directory tree ==="
          find source -maxdepth 4 -type d | sort
          echo "==========================="

          PROJECT_DIR=$(find source -type d -exec test -e "{}/build.gradle" \; -exec test -d "{}/lib" \; -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find project directory with build.gradle and lib"
            exit 1
          fi

          echo "Found project directory: $PROJECT_DIR"
          shopt -s dotglob
          cp -r "$PROJECT_DIR"/* .
          shopt -u dotglob
          rm -rf source virtualapp-source.zip
          rm -f gradlew gradlew.bat
          rm -rf gradle/wrapper
          echo "=== Root after copy ==="
          ls -la

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          # تنزيل أدوات SDK
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-7584222_latest.zip
          mkdir -p android_sdk/cmdline-tools
          unzip -q commandlinetools-linux-7584222_latest.zip -d android_sdk/cmdline-tools
          mv android_sdk/cmdline-tools/cmdline-tools android_sdk/cmdline-tools/latest
          export ANDROID_HOME=$PWD/android_sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          # قبول التراخيص
          yes | sdkmanager --licenses > /dev/null 2>&1

          # تثبيت المكونات المطلوبة (تستخدم VirtualApp غالباً SDK 25 و build-tools متوافقة)
          sdkmanager "platforms;android-25" "build-tools;25.0.3" "platform-tools" > /dev/null 2>&1

          echo "Android SDK installed."

      - name: Download and run Gradle 6.9
        env:
          ANDROID_HOME: ${{ github.workspace }}/android_sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android_sdk
        run: |
          echo "Downloading Gradle 6.9..."
          wget -q https://services.gradle.org/distributions/gradle-6.9-bin.zip
          unzip -q gradle-6.9-bin.zip
          export GRADLE_HOME=$PWD/gradle-6.9
          export PATH=$GRADLE_HOME/bin:$PATH

          # تأكيد وجود SDK
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -l $ANDROID_HOME/platforms/

          gradle -v
          gradle :lib:assembleRelease --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: virtualapp-aar
          path: lib/build/outputs/aar/*.aar
