name: Build VirtualApp AAR (Direct Gradle)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          unzip virtualapp-source.zip -d ./source
          # نسخ كل شيء من أعمق مجلد (يحتوي على lib, app, build.gradle)
          shopt -s dotglob
          DEEPEST=$(find ./source -type d -links 2 | head -1)
          if [ -n "$DEEPEST" ]; then
            cp -r "$DEEPEST"/* .
          else
            cp -r ./source/*/*/* . 2>/dev/null || cp -r ./source/*/* . 2>/dev/null || cp -r ./source/* .
          fi
          rm -rf ./source virtualapp-source.zip
          ls -la

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Verify Java
        run: java -version

      - name: Download and run Gradle 6.9 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-6.9-bin.zip
          unzip gradle-6.9-bin.zip
          export PATH=$PWD/gradle-6.9/bin:$PATH
          gradle -v
          gradle :lib:assembleRelease --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: virtualapp-aar
          path: lib/build/outputs/aar/*.aar
