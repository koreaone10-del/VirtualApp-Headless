name: Unzip and Build VirtualApp AAR

on:
  workflow_dispatch: # تشغيل يدوي

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          unzip virtualapp-source.zip -d ./source
          cp -r ./source/VirtualApp/* .
          rm -rf ./source virtualapp-source.zip

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build AAR
        run: ./gradlew :lib:assembleRelease

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtualapp-aar
          path: lib/build/outputs/aar/*.aar
