name: Build VirtualApp AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04   # إصدار قديم يحتوي على JDK 8 بسهولة

    steps:
      - uses: actions/checkout@v4

      - name: Unzip and prepare source
        run: |
          unzip virtualapp-source.zip -d ./source
          cp -r ./source/*/*/* . 2>/dev/null || cp -r ./source/*/* . 2>/dev/null || cp -r ./source/* .
          rm -rf ./source virtualapp-source.zip

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'   # Zulu JDK 8 يعمل على ubuntu-20.04

      - name: Verify Java version
        run: java -version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build AAR
        run: ./gradlew :lib:assembleRelease --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}   # سيُضبط تلقائياً بواسطة setup-java

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: virtualapp-aar
          path: lib/build/outputs/aar/*.aar
