name: Build VirtualApp AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v4

      - name: Unzip and prepare source
        run: |
          unzip virtualapp-source.zip -d ./source
          cp -r ./source/*/*/* . 2>/dev/null || cp -r ./source/*/* . 2>/dev/null || cp -r ./source/* .
          rm -rf ./source virtualapp-source.zip
          # تحديث إصدار Gradle إلى 6.9 لدعم Java 11
          sed -i 's/gradle-4.1-all.zip/gradle-6.9-all.zip/g' gradle/wrapper/gradle-wrapper.properties
          # إظهار الهيكل للتأكد
          ls -la
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Verify Java version
        run: java -version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build AAR
        run: ./gradlew :lib:assembleRelease --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: virtualapp-aar
          path: lib/build/outputs/aar/*.aar
